# Storygrain Creative: storygrain.co
# Static site, no build step. Netlify publishes the repo root.
# Rebuilt from the live response headers when the site moved to GitHub (Nov 2026).

[build]
  publish = "."

# Security headers on every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images cache for a week
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Hidden pages stay out of search
[[headers]]
  for = "/packages/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/release/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/clients/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Branded form emails (netlify/functions/submission-created.mjs)
[functions]
  directory = "netlify/functions"
